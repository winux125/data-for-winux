services:
  web:
    build:
      context: ../..
      dockerfile: deploy/brev/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - runtime.env
    environment:
      NODE_ENV: production
      DEPLOYMENT_TARGET: brev
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
