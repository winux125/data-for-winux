name: Source and frontend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/verify_runtime.py
      - run: python -m pytest tests legal_rag/tests -q
      - run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/install_services.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build from the clean checkout, including typecheck, tests and lint
        run: docker build -f deploy/Dockerfile.frontend -t forte-vision:ci forte-vision
