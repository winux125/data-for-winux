[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fortebank-legal-rag"
version = "0.1.0"
description = "Local legal retrieval, norm application and grounded explanations from structured observations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["legal_rag", "legal_rag.tests"]
namespaces = false

[tool.setuptools.package-data]
legal_rag = ["data/*.json", "examples/*.json", "resources/**/*", "README.md", "requirements-gpu.txt"]
